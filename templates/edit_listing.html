{% extends "base.html" %}

{% block content %}
<div class="hero">
    <h1>Edit Listing</h1>

    <form method="POST">
        <input type="text" name="title" value="{{ listing.title }}" required><br><br>
        <input type="text" name="location" value="{{ listing.location }}" required><br><br>
        <input type="number" name="price" value="{{ listing.price }}" required><br><br>
        <input type="text" name="room_type" value="{{ listing.room_type }}" required><br><br>

        <textarea name="description" required>{{ listing.description }}</textarea><br><br>

        <button type="submit" class="btn">Update Listing</button>
    </form>
</div>
{% endblock %}
