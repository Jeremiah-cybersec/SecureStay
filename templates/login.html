{% extends "base.html" %}

{% block content %}
<div class="hero">
    <h1>Login</h1>

    <form method="POST" class="auth-form">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit" class="btn">Login</button>
    </form>
</div>
{% endblock %}
